services:

  postgres:
    image: postgres:17
    container_name: jobqueue-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobqueue
    ports:
      - "5434:5432"
    volumes:
      - jobqueue_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: jobqueue-redis
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: jobqueue-api
    ports:
      - "8020:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobqueue
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobqueue
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  jobqueue_postgres_data: